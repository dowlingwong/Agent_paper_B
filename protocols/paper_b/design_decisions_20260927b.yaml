controller_v2:
  proposed: cross_fitted_continuation_value_timing
  continuation_target: out_of_fold_second_stage_decision_times_observed_paired_outcome
  checkpoint1_score: A1_hat_minus_Vwait_hat
  folds: template_family
  optimality_claim: false
  note: budget-constrained heuristic; standard optimal-stopping methodology applied, not new
  primary_comparators: [repeated_myopic, bavar_inspired_voi]
  ablations: [constant_reserve]
  diagnostics: [fixed_now, fixed_later, fixed_never]
  retired: [sampling_only_variant]

allocator:
  name: two_phase_hard_budget
  budget: floor(0.25 * N_original)
  max_verifications_per_root: 1
  phase1: rank feasible roots by s1; verify s1 > c1 up to B - R
  phase2: rank reached unverified feasible roots by s2; verify s2 > c2 until exhausted
  tie_break: outcome_blind_sha256_of_root_id
  infeasible: continue fallback
  early_terminated: skipped
  unspent_capacity: retained

n1:
  location: evaluation_only
  controllers_use_p: false
  population_tax: 2 * m * p_path
  m: 3
  m_status: provisional_derivation_pending_independent_review
  displacement_check: evaluate_tree.displacement_check (empirical max 3)
  interference_scope: covers allocation interference under the derived m (pending independent review)
  reference: docs/paper_split/N1_DISPLACEMENT.md

task_realism:
