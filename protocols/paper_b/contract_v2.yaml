actions:
  continue: 'g0: continue with frozen rho; no external call'
  verify_and_response: 'gv: fixed verifier input, output schema, result-to-response
    rule, maximum work, termination, then resume rho'
  verify_later: continue to checkpoint 2; verify if reached and feasible with
    remaining budget, otherwise continue under the registered fallback
outcomes:
  primary: U
  utility_definition: hidden-test accuracy of the final valid candidate in [0,1];
    invalid or no candidate is exactly 0 with its reason retained
  binary_success_definition: independently adjudicated validated completion by the
    registered horizon (secondary)
  invalid_and_missing_policy: invalid output carries U=0 with outcome_invalid=1 and
    invalid_reason; collection failure is a separate integrity status and is never
    read as 0; no outcome is assigned to an unavailable action
  secondary:
  - binary_validated_completion
  - validity
  - individual_degradation_frequency
allocation:
  mode: original_root_tree
  primary_capacity: 0.25
  descriptive_capacities:
  - 0.05
  - 0.10
  - 0.50
  one_step_rule: ceil(q * n_feasible); report effective capacity
  tree_rule: floor(q * N_original); at most one verifier call per root
  max_verifications_per_root: 1
  allocator: two_phase_hard_budget
  allocator_phase1: rank feasible roots by s1, verify s1 > c1 up to B - R
  allocator_phase2: rank reached unverified feasible roots by s2, verify s2 > c2
    until capacity is exhausted
  allocator_tie_break: outcome_blind_sha256_of_root_id
  unspent_capacity: retained
  budget_matching: same allowed verifier-call and total-work budgets for every
    controller; realized use reported separately; unspent capacity stays unspent
  cost_definition: incremental verifier cost vector; prefix, checkpoint-2,
    verifier overhead, failed attempts and storage reported separately from total
    cost
learning:
  feature_allowlist: registered pre-treatment representation Z and feasibility mask
    M only
  comparator_family: matched linear/linear-contrast family, same tuning budget for
    the utility-deficit, advantage and action-value learners
  selection_rule: cross-fitted continuation-value timing score plus a reserve
    threshold fixed on development data; frozen before the pilot
  proposed_controller: cross_fitted_continuation_value_timing
  continuation_target: out_of_fold_second_stage_decision_times_observed_paired_outcome
  optimality_claim: false
  primary_comparators:
  - repeated_myopic
  - bavar_inspired_voi
  ablations:
  - constant_reserve
  diagnostic_variants:
  - never
  - verify_now
  - verify_later
  utility_risk_comparator: utility_deficit
  failure_risk_role: secondary
  h2_status: HISTORICAL; ridge advantage vs action-value is an implementation
    equivalence check (agreement within 1e-12), not a hypothesis
statistics:
  split_manifest: null
  primary_estimand: paired original-root mean U contrast of the frozen
    two-checkpoint controller against each primary comparator, over all original
    roots
  independent_unit_count: null
  repetitions: 2
  inference_method: template-family cluster bootstrap with shared draws across
    policies; batch coupling accounted for; no per-root i.i.d. certificate
  multiplicity: simultaneous intervals for the two primary comparator contrasts
  practical_gain_target: 0.02
  no_injected_fault_mean_harm_tolerance: 0.02
  harm_reference: never_verify
  practical_falsifier: adjusted upper confidence bound below 0.02
  inconclusive: target crossed by the interval; no positive claim or automatic
