- claim_id: B-C6
  paper: B
  statement: 'N2 (primary, PLANNED): the frozen cross-fitted continuation-value timing rule improves the original-root mean U against BOTH a repeated-myopic controller and a BAVAR-inspired context-dependent VOI scheduler at the same allowed verifier and total-work budgets, with simultaneous intervals over the two contrasts and template families as units. The rule is a budget-constrained heuristic, never optimal; the constant reserve is an ablation only; B''s contribution is the agent setting and the paired counterfactual measurement design, not a new timing method.'
  status: PLANNED
  source_labels:
  - sec:b-problem
  - sec:policy
  - eq:primary-contrasts
  - eq:original-root-value
  assumptions:
  - candidate-consistency task (B6)
  - template-family clusters and splits
  - all original roots including early-terminal and infeasible
  - at most one verification per root
  - matched allowed budgets
  proof_paths: []
  experiment_ids:
  - B-screen
  - B-pilot
  raw_artifacts:
  - experiments/paper_b/task_cc
  - experiment_scaffold/src/causal_branch/control/branch_tree.py
  - experiment_scaffold/src/causal_branch/control/timing.py
  - experiment_scaffold/src/causal_branch/control/evaluate_tree.py
  analysis_command: '.venv/bin/python -m unittest discover -s tests/control -p ''test_*.py''  # engineering only; the live screen and pilot need Ada qualification'
  figure_or_table:
  - fig:timing
  - tab:b-cap
  known_limitations:
  - PLANNED; no live result
  - falsified if the adjusted LCB does not exceed 0 for either comparator, or the adjusted UCB is below the 0.02 target
  - an interval spanning 0.02 is inconclusive with no budget expansion
  - task realism FAILED R1 and R4 for the typical behaviour after one repair pass (see TASK_REALISM_REPORT.md)
  - the proposed-vs-myopic contrast is exactly zero when waiting value depends only on the same H1 context as immediate value (every linear score then ranks roots alike); any reading other than inconclusive requires distinct realized policies and a nonzero-width interval
  - 'in a CPU save-for-later probe with a shared (c1,c2) grid the proposed rule matched repeated-myopic (mean contrast -0.001 over 5 worlds): a tuned one-step cutoff can capture most waiting value'
  nearest_prior:
  - Calibration Is Not Control arXiv:2606.21399 (single-checkpoint action conditioning)
  - 'BAVAR / Strategic Verification for Long-Running LLM Agents, preprints.org 202608.2057 (timing, reserve signals; UNVERIFIED at source: automated access blocked 2026-09-27 and 2026-09-29; no section attributed until an author reads it)'
  - Calibrate-Then-Act arXiv:2602.16699 (Ding, Tomlin & Durrett; verified at source)
  new_increment: original-root, action-dependent two-checkpoint timing evaluation under matched allowed budgets and an explicit replay-uncertainty contract; not a new timing method
  review_result: blocked
- claim_id: B-C7
  paper: B
  statement: 'N1 (validity constraint, PLANNED): under a declared joint discrepancy event of probability at most p, bounded utility, a fixed policy and the companion''s calibration independence, the population gain lower bound loses at most 2p.'
  status: PLANNED
  source_labels:
  - prop:n1-population
  - sec:b-theory
  assumptions:
  - declared joint discrepancy event with probability <= p
  - U in [0,1]
  - fixed policy
  - companion calibration independence
  - population scope only
  proof_paths:
  - papers/paper_b/appendices/B_proofs.tex
  experiment_ids:
  - B-pilot
  raw_artifacts:
  - experiment_scaffold/src/causal_branch/control/replay_validity.py
  analysis_command: .venv/bin/python -m unittest discover -s tests/control -p 'test_replay_validity.py'
  figure_or_table:
  - tab:b-figure-slots
  known_limitations:
  - p is a sensitivity assumption on the grid {0,.005,.01,.02,.05,.10} with working value .02, never measured
  - 'for the batch-allocated two-checkpoint contrasts each grid value is a per-checkpoint allowance (p1 = p2 = p), p_path = min(1, p1 + p2), and the population tax is 2*m*p_path with the derived displacement m <= 3 (N1_DISPLACEMENT.md): .24 U at the working p; the grid, tax and reported bound use this one mapping'
  - no pointwise gate LCB(w)-2p from a global p
  - the binary R=1 sharper endpoint is not applied to continuous U
  - falsified by a counterexample satisfying the assumptions
  - practical value falsified if the allowance does not improve the declared utility/harm tradeoff at equal allowed resources, including always-abstain
  nearest_prior:
  - partial identification under contamination (Altschuler et al. 2019)
  - anonymous companion 2p bounded-outcome corollary
  - Strategic Verification (timing; source not verified here)
  new_increment: application of the companion's population bound as a validity constraint on the timing comparison; not a new safety theorem
  review_result: blocked
