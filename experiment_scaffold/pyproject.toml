[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-branch-scaffold"
version = "0.0.1"
description = "No-API scaffold for the Contract A checkpoint branch experiment"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
causal-branch = "causal_branch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
