[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-paper-b"
version = "0.0.1"
description = "Paper B, route R1: noisy incumbent-relative acceptance in governed autoresearch loops"
requires-python = ">=3.11"

[project.optional-dependencies]
# Planning/validation runtime used by the root Makefile and the protocol
# validator. Versions are pinned exactly in requirements.lock; the ranges below
# are floors for development convenience only. requirements.lock is
# authoritative — the legacy test suite under archive/old_b_2026-10-09/code/ uses it.
# Route R1 runs against the harness environment (see docs/r1/RUNBOOK.md).
runtime = [
    "PyYAML>=6.0",
    "numpy>=1.24",
]

# Pilot plotting runtime, kept separate from model execution.
figures = ["matplotlib==3.11.2"]

[tool.pytest.ini_options]
testpaths = ["r1/tests"]
